<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>PDF Editor — free, private, no upload | S3eidat Tools</title>
<meta name="description" content="Edit PDFs in your browser: add text, highlight, draw, shapes, images and signatures, reorder, rotate and delete pages, merge PDFs. Free, no sign-up, nothing is uploaded.">
<link rel="canonical" href="https://s3eidat.github.io/pdf-editor/">
<link rel="icon" href="/kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="/kit/kit.js"></script>
<script src="lib/pdf-lib.min.js"></script>
</head>
<body data-tool="pdf-editor">
<main class="pe" id="pe">
  <div class="pe-bar" id="bar">
    <div class="pe-grp">
      <button class="btn small primary" id="b-open" type="button">Open PDF</button>
      <button class="btn small" id="b-export" type="button" disabled>Download PDF</button>
    </div>
    <div class="pe-grp">
      <button class="btn small icon" id="b-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
      <button class="btn small icon" id="b-redo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>↷</button>
    </div>
    <div class="pe-grp" id="tools" role="toolbar" aria-label="Tools">
      <button class="btn small tool on" data-tool="select" type="button" title="Select and move (V)">Select</button>
      <button class="btn small tool" data-tool="text" type="button" title="Text (T)">Text</button>
      <button class="btn small tool" data-tool="pen" type="button" title="Draw (P)">Draw</button>
      <button class="btn small tool" data-tool="highlight" type="button" title="Highlight (H)">Highlight</button>
      <button class="btn small tool" data-tool="rect" type="button" title="Rectangle (R)">Rectangle</button>
      <button class="btn small tool" data-tool="ellipse" type="button" title="Ellipse (E)">Ellipse</button>
      <button class="btn small tool" data-tool="line" type="button" title="Line (L)">Line</button>
      <button class="btn small tool" data-tool="arrow" type="button" title="Arrow (A)">Arrow</button>
      <button class="btn small tool" data-tool="whiteout" type="button" title="Cover with white (W)">Whiteout</button>
      <button class="btn small tool" data-tool="image" type="button" title="Insert image (I)">Image</button>
      <button class="btn small tool" data-tool="sign" type="button" title="Signature (G)">Sign</button>
    </div>
    <div class="pe-grp pe-opts" id="opts">
      <label class="pe-o" title="Colour"><input type="color" id="o-color" value="#d92d20" aria-label="Colour"></label>
      <label class="pe-o" id="w-wrap" title="Line width">Width <input type="number" id="o-width" min="1" max="40" value="3"></label>
      <label class="pe-o" id="f-wrap" title="Font">
        <select id="o-font" aria-label="Font"><option value="Helvetica">Helvetica</option><option value="Times">Times</option><option value="Courier">Courier</option></select>
      </label>
      <label class="pe-o" id="s-wrap" title="Font size">Size <input type="number" id="o-size" min="6" max="144" value="16"></label>
      <button class="btn small icon" id="o-bold" type="button" title="Bold" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button class="btn small icon" id="o-italic" type="button" title="Italic" aria-label="Italic" aria-pressed="false"><i>I</i></button>
      <button class="btn small danger" id="o-del" type="button" title="Delete selected (Del)" disabled>Delete</button>
    </div>
    <div class="pe-grp pe-zoom">
      <button class="btn small icon" id="z-out" type="button" title="Zoom out (-)" aria-label="Zoom out">−</button>
      <span id="z-val" class="pe-zv">100%</span>
      <button class="btn small icon" id="z-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="btn small" id="z-fit" type="button" title="Fit width (0)">Fit</button>
    </div>
  </div>

  <div class="pe-work">
    <aside class="pe-side" id="side" hidden>
      <div class="pe-pagebar">
        <button class="btn small icon" id="p-left" type="button" title="Rotate left" aria-label="Rotate page left">⟲</button>
        <button class="btn small icon" id="p-right" type="button" title="Rotate right" aria-label="Rotate page right">⟳</button>
        <button class="btn small icon" id="p-up" type="button" title="Move page earlier" aria-label="Move page earlier">↑</button>
        <button class="btn small icon" id="p-down" type="button" title="Move page later" aria-label="Move page later">↓</button>
        <button class="btn small icon" id="p-dup" type="button" title="Duplicate page" aria-label="Duplicate page">⧉</button>
        <button class="btn small icon" id="p-blank" type="button" title="Insert blank page after" aria-label="Insert blank page after">+</button>
        <button class="btn small icon danger" id="p-del" type="button" title="Delete page" aria-label="Delete page">🗑</button>
        <button class="btn small" id="p-merge" type="button" title="Append pages from another PDF">Merge PDF</button>
      </div>
      <div class="pe-thumbs" id="thumbs"></div>
    </aside>
    <section class="pe-stage" id="stage">
      <div class="pe-empty" id="empty">
        <div class="pe-drop" id="drop" role="button" tabindex="0">
          <svg class="i" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6M9 17h4"/></svg>
          <h1>Free PDF editor</h1>
          <p>Drop a PDF here, or click to choose one.</p>
          <p class="faint">Add text, highlights, drawings, shapes, images and your signature. Reorder, rotate, delete and merge pages. Your file never leaves this device.</p>
          <button class="btn primary big" id="b-open2" type="button">Choose a PDF</button>
          <button class="btn ghost" id="b-new" type="button">or start with a blank page</button>
        </div>
      </div>
      <div class="pe-canvaswrap" id="cwrap" hidden>
        <div class="pe-page" id="pagebox">
          <canvas id="pc" class="pe-pc"></canvas>
          <canvas id="oc" class="pe-oc"></canvas>
          <textarea id="ta" class="pe-ta" hidden spellcheck="false" aria-label="Text"></textarea>
        </div>
      </div>
      <div class="pe-status" id="status" hidden><span id="pg-info">Page 1 / 1</span>
        <button class="btn small icon" id="pg-prev" type="button" aria-label="Previous page">‹</button>
        <button class="btn small icon" id="pg-next" type="button" aria-label="Next page">›</button>
      </div>
    </section>
  </div>
  <input type="file" id="f-pdf" accept="application/pdf,.pdf" hidden>
  <input type="file" id="f-merge" accept="application/pdf,.pdf" hidden>
  <input type="file" id="f-img" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <dialog id="sig" class="pe-sig">
    <h2>Your signature</h2>
    <div class="pe-tabs"><button class="btn small on" id="sg-draw" type="button">Draw</button><button class="btn small" id="sg-type" type="button">Type</button></div>
    <canvas id="sg-c" width="520" height="180"></canvas>
    <input type="text" id="sg-t" placeholder="Type your name" maxlength="40" hidden>
    <div class="row">
      <button class="btn small" id="sg-clear" type="button">Clear</button>
      <button class="btn small" id="sg-saved" type="button" hidden>Use saved</button>
      <span class="pe-spacer"></span>
      <button class="btn small ghost" id="sg-cancel" type="button">Cancel</button>
      <button class="btn small primary" id="sg-ok" type="button">Place on page</button>
    </div>
    <label class="pe-chk"><input type="checkbox" id="sg-save" checked> Remember on this device</label>
  </dialog>
</main>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"PDF Editor","url":"https://s3eidat.github.io/pdf-editor/","description":"Free PDF editor that runs in your browser: add text, highlights, drawings, shapes, images and signatures, manage pages and merge PDFs. Nothing is uploaded.","applicationCategory":"BusinessApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
