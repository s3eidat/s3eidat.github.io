<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Gantt", "url": "https://s3eidat.github.io/gantt/", "description": "A free Gantt chart planner that runs 100% in your browser: outline with summary tasks, working-day durations, dependencies with lag, critical path, baseline, export to PNG, PDF and CSV, and import of CSV and Microsoft Project XML. No sign-up, nothing uploaded.", "applicationCategory": "BusinessApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/gantt/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>
<script src="core.js"></script>
<script src="app.js" defer></script>
</head>
<body data-tool="gantt">
<main class="s3-main gt">
  <div class="gt-bar">
    <input class="input gt-name" id="pName" maxlength="120" dir="auto" aria-label="Project name" autocomplete="off">
    <div class="gt-group">
      <button class="btn small" id="newBtn" type="button"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">New</span></button>
      <button class="btn small" id="openBtn" type="button"><svg class="i"><use href="#i-file"/></svg><span class="lbl">Open</span></button>
      <button class="btn small" id="saveBtn" type="button" title="Save as a file (Ctrl+S)"><svg class="i"><use href="#i-download"/></svg><span class="lbl">Save file</span></button>
      <button class="btn primary small" id="exportBtn" type="button"><svg class="i"><use href="#i-image"/></svg>Export</button>
    </div>
    <div class="gt-group">
      <button class="btn ghost icon small" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn ghost icon small" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn ghost icon small" id="setBtn" type="button" title="Project settings: start, weekend, holidays" aria-label="Project settings"><svg class="i"><use href="#i-settings"/></svg></button>
      <button class="btn ghost icon small" id="helpBtn" type="button" title="Shortcuts (?)" aria-label="Help">?</button>
    </div>
  </div>
  <div class="gt-bar gt-tools">
    <button class="btn small" id="addTask" type="button" title="Add a task below the selected one (Enter in a name)"><svg class="i"><use href="#i-plus"/></svg>Task</button>
    <button class="btn small" id="addMile" type="button" title="Add a milestone (0 days)">◆ Milestone</button>
    <div class="gt-group">
      <button class="btn ghost small" id="outBtn" type="button" title="Outdent (Shift+Tab)" aria-label="Outdent">⇤</button>
      <button class="btn ghost small" id="inBtn" type="button" title="Indent: make it a subtask (Tab)" aria-label="Indent">⇥</button>
      <button class="btn ghost small" id="upBtn" type="button" title="Move up (Alt+↑)" aria-label="Move up">↑</button>
      <button class="btn ghost small" id="downBtn" type="button" title="Move down (Alt+↓)" aria-label="Move down">↓</button>
      <button class="btn ghost small" id="linkBtn" type="button" title="Link the selected tasks in order (finish to start)">Link</button>
      <button class="btn ghost small" id="unlinkBtn" type="button" title="Remove links between the selected tasks">Unlink</button>
      <button class="btn ghost small" id="editBtn" type="button" title="Edit the selected task">Edit</button>
      <button class="btn ghost small danger" id="delBtn" type="button" title="Delete the selected tasks (Delete)">Delete</button>
    </div>
    <span class="grow"></span>
    <div class="seg" id="zoom" role="radiogroup" aria-label="Zoom">
      <button type="button" data-z="day" aria-pressed="false">Days</button>
      <button type="button" data-z="week" aria-pressed="true">Weeks</button>
      <button type="button" data-z="month" aria-pressed="false">Months</button>
    </div>
    <button class="btn ghost small" id="todayBtn" type="button">Today</button>
    <button class="btn ghost small" id="critBtn" type="button" aria-pressed="false" title="Show the critical path">Critical path</button>
    <button class="btn ghost small" id="baseBtn" type="button" title="Save or clear a baseline">Baseline</button>
  </div>
  <div class="gt-info" id="info"></div>
  <div class="gt-scroll" id="scroll">
    <div class="gt-grid" id="grid">
      <div class="gt-head"><div class="gt-thead" id="thead"></div><svg class="gt-scale" id="scale" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg></div>
      <div class="gt-body"><div class="gt-tbody" id="tbody"></div><svg class="gt-chart" id="chart" xmlns="http://www.w3.org/2000/svg" aria-label="Gantt chart" role="img"></svg></div>
    </div>
    <div class="gt-empty" id="empty" hidden>
      <b>Plan your project</b>
      <span>Add a task, or start from a template. Durations are in working days; link tasks to schedule them automatically.</span>
      <div class="row" id="emptyBtns"></div>
    </div>
  </div>
</main>
</body>
</html>
