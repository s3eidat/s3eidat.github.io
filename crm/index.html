<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>CRM — free simple CRM for small business, data stays with you | S3eidat Tools</title>
<meta name="description" content="Free small-business CRM in your browser: contacts, companies, a deal pipeline board, tasks, activity timeline and CSV import/export. No sign-up, data stays on your device.">
<link rel="canonical" href="https://s3eidat.github.io/crm/">
<link rel="icon" href="/kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="app.css">
<script src="/kit/kit.js"></script>
</head>
<body data-tool="crm">
<main class="s3-main crm" id="crm">
  <div class="crm-head">
    <div class="grow">
      <h1>CRM</h1>
      <p class="faint" id="crm-stats">Contacts, deals and tasks. Everything stays in this browser.</p>
    </div>
    <div class="row" id="crm-actions"></div>
  </div>
  <div class="crm-bar">
    <nav class="seg crm-tabs" id="crm-tabs" aria-label="Sections"></nav>
    <label class="crm-search"><span class="sr">Search</span><input id="crm-q" class="input" type="search" placeholder="Search…" autocomplete="off" dir="auto"></label>
  </div>
  <section id="crm-view" aria-live="polite"></section>
</main>
<script src="app.js"></script>
</body>
</html>
