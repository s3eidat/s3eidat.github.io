<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Mind Map", "url": "https://s3eidat.github.io/mind-map/", "description": "A free, keyboard-first mind mapping tool that runs 100% in your browser: auto layout, drag to reorganise, colours, icons, notes, export to PNG, SVG, PDF and Markdown, import outlines and FreeMind files. No sign-up, nothing uploaded.", "applicationCategory": "DesignApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/mind-map/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>
<script src="core.js"></script>

<body data-tool="mind-map">
<main class="s3-main mm">
  <div class="mm-bar">
    <input class="input mm-name" id="mapName" maxlength="120" dir="auto" aria-label="Map name" autocomplete="off">
    <div class="mm-group">
      <button class="btn small" id="newBtn" type="button"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">New</span></button>
      <button class="btn small" id="openBtn" type="button"><svg class="i"><use href="#i-file"/></svg><span class="lbl">Open</span></button>
      <button class="btn small" id="saveBtn" type="button" title="Save as a file (Ctrl+S)"><svg class="i"><use href="#i-download"/></svg><span class="lbl">Save file</span></button>
      <button class="btn primary small" id="exportBtn" type="button"><svg class="i"><use href="#i-image"/></svg>Export</button>
    </div>
    <div class="mm-group">
      <button class="btn ghost icon small" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn ghost icon small" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn ghost icon small" id="zoomOut" type="button" title="Zoom out (-)" aria-label="Zoom out">−</button>
      <button class="btn ghost small mm-zoom" id="zoomFit" type="button" title="Fit the map (F)">100%</button>
      <button class="btn ghost icon small" id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="btn ghost small" id="themeBtn" type="button" title="Map style">Style</button>
      <button class="btn ghost small" id="findBtn" type="button" title="Find a topic (Ctrl+F)">Find</button>
      <button class="btn ghost icon small" id="helpBtn" type="button" title="Shortcuts (F1)" aria-label="Help">?</button>
    </div>
  </div>
  <div class="mm-tools" id="tools">
    <button class="btn small" id="childBtn" type="button" title="Add a subtopic (Tab)">+ Subtopic</button>
    <button class="btn small" id="sibBtn" type="button" title="Add a topic next to it (Enter)">+ Topic</button>
    <button class="btn ghost small" id="editBtn" type="button" title="Edit text (F2)">Edit</button>
    <button class="btn ghost small" id="colBtn" type="button" title="Collapse or expand (Space)">Collapse</button>
    <button class="btn ghost small" id="colorBtn" type="button" title="Branch colour">Colour</button>
    <button class="btn ghost small" id="iconBtn" type="button" title="Icon">Icon</button>
    <button class="btn ghost small" id="noteBtn" type="button" title="Note">Note</button>
    <button class="btn ghost small danger" id="delBtn" type="button" title="Delete (Delete)">Delete</button>
  </div>
  <div class="mm-stage" id="stage">
    <svg id="svg" class="mm-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mind map"><g id="world"><g id="links"></g><g id="nodes"></g><g id="over"></g></g></svg>
    <textarea id="editor" class="mm-editor" hidden dir="auto" spellcheck="true" aria-label="Topic text"></textarea>
  </div>
  <p class="faint mm-hint" id="hint">Tab adds a subtopic, Enter adds a topic, type to edit, drag topics to move them. Double-click (double-tap) to edit.</p>
</main>
</body>
</html>
