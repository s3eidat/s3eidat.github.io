<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Floor Plan — free floor plan maker with room areas | S3eidat Tools</title>
<meta name="description" content="Free 2D floor plan maker: draw walls and rooms, see lengths and areas in m², add doors, windows and furniture, export PNG or a PDF to scale. No sign-up.">
<link rel="canonical" href="https://s3eidat.github.io/floor-plan/">
<link rel="icon" href="/kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="app.css">
<script src="/kit/kit.js"></script>
</head>
<body data-tool="floor-plan">
<main class="s3-main fp" id="fp">
  <div class="fp-head">
    <div class="grow">
      <label class="sr" for="fp-name">Plan name</label>
      <input id="fp-name" class="fp-name" type="text" maxlength="80" placeholder="Untitled plan" dir="auto" autocomplete="off">
      <p class="faint" id="fp-stats"></p>
    </div>
    <div class="row" id="fp-actions"></div>
  </div>
  <div class="fp-toolbar" id="fp-toolbar"></div>
  <div class="fp-work">
    <div class="fp-canvas" id="fp-canvas">
      <svg id="fp-svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Floor plan drawing area"><g id="fp-grid"></g><g id="fp-world"></g><g id="fp-over"></g></svg>
      <div class="fp-hint" id="fp-hint"></div>
      <div class="fp-zoom" id="fp-zoom"></div>
    </div>
    <aside class="fp-side" id="fp-side" aria-label="Properties and furniture"></aside>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
